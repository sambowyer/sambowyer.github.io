# NOTE: the one-line `summary` fields are paraphrases of each title, written as
# placeholders -- worth rewriting in your own words before this goes live.
papers:
  - title: "Efficient Benchmarking Is Just Feature Selection and Multiple Regression"
    venue: preprint
    year: 2026
    url: https://arxiv.org/abs/2605.25773
    summary: Frames choosing a benchmark subset as feature selection, then predicting full-benchmark scores by regression.
  - title: "Learning Generation Orders for Masked Discrete Diffusion Models via Variational Inference"
    venue: ICLR DeLTa Workshop
    year: 2026
    url: https://arxiv.org/abs/2602.23968
    summary: Treats the unmasking order in discrete diffusion as a latent variable learned by variational inference.
  - title: "Position: Don't Use the CLT in LLM Evals With Fewer Than a Few Hundred Datapoints"
    venue: ICML Spotlight
    year: 2025
    url: https://arxiv.org/abs/2503.01747
    summary: Argues against normal-approximation error bars on small LLM eval sets.
  - title: "Massively Parallel Expectation Maximization For Approximate Posteriors"
    venue: AABI
    year: 2025
    url: https://arxiv.org/abs/2503.08264
    summary: A massively parallel formulation of EM for fitting approximate posteriors.
  - title: "Using Autodiff to Estimate Posterior Moments, Marginals and Samples"
    venue: UAI
    year: 2024
    url: https://arxiv.org/abs/2310.17374
    summary: Uses automatic differentiation to extract posterior moments, marginals and samples.

projects:
  - name: mrmr_eval
    url: https://github.com/sambowyer/mrmr_eval/
    summary: A minimal tutorial on using mRMR for efficient LLM benchmarking.
  - name: bayes_evals
    url: https://github.com/sambowyer/bayes_evals
    summary: A lightweight library for Bayesian analysis of LLM evals.
  - name: alan
    url: https://github.com/alan-ppl/alan
    summary: A massively parallel probabilistic programming language.

