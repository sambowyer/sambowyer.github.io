# Single source of truth for the site's content.
# All design variants render from this file, so content edits land everywhere at once.

bio: >-
  I'm a Member of Technical staff at Cohere, working on pretraining evals.
  Previously, I spent four years on a PhD in probabilistic machine learning
  at the University of Bristol's Compass CDT (viva pending!). My research 
  interests include probabilistic modelling, deep learning, and using 
  traditional statistics to improve LLM evaluation procedures.
now: >-
  Feel free to get in touch!

