---
layout: default
---
<div class="topbar">{%- include theme_toggle.html -%}</div>

<p class="backlink"><a href="{{ '/' | relative_url }}">&larr; index</a></p>

<article class="post">
  <h1>{{ page.title }}</h1>
  <div class="post__meta">
    {{ page.date | date: "%Y-%m-%d" }}
    {%- if page.categories.size > 0 %} // {{ page.categories | join: " // " }}{% endif -%}
  </div>
  {{ content }}
</article>

<p class="foot">{{ site.title }} // Bristol</p>
